 asm:{m:18,src:'No public build-time source for a turbine assembly hall. 18 months is a game assumption',s:0},
 inst:{m:3,src:'Installing a delivered turbine on site: 3 months is a game assumption (the EIA 2-year lead time is mostly the factory queue)',s:0},
 belt:{m:1,src:'No public source for on-site conveyor links. 1 month is a game assumption',s:0}};
