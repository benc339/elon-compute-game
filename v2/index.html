// ============ TIME & DATA ============
const QS=['Q4 2026','Q1 2027','Q2 2027','Q3 2027','Q4 2027','Q1 2028','Q2 2028','Q3 2028','Q4 2028'];
const GOALQ=4;
const RIV={OpenAI:{g:1.1,nv:.95},Oracle:{g:.8,nv:.95},AWS:{g:1.0,nv:.5},Anthropic:{g:1.2,nv:.4},Google:{g:1.0,nv:.25},Meta:{g:.36,nv:.9},Microsoft:{g:.27,nv:.8},CoreWeave:{g:.34,nv:1},Others:{g:1.5,nv:.8}};

const SUP=[
 {id:'nv',n:'NVIDIA',it:'gpu',u:'GW racks',lead:1,open:1,price:q=>q<1?25:40,cap:q=>Math.min(q<1?7:8.5,cowosEq(q)*.65,hbmEq(q)*.6),rd:r=>RIV[r].g*RIV[r].nv,note:'GB300 now, Vera Rubin from Q1 2027'},
 {id:'tsmc',n:'TSMC N3 + CoWoS',it:'chip',u:'GW-eq',lead:3,open:.15,price:()=>16,cap:q=>cowosEq(q),rd:r=>RIV[r].g*(1-RIV[r].nv),tech:'ownchip',note:'For your own chip (needs HBM too)'},
 {id:'skh',n:'SK hynix HBM',it:'hbm',u:'GW-eq',lead:2,open:.2,price:()=>2,cap:q=>hbmEq(q)*.55,rd:r=>RIV[r].g*(1-RIV[r].nv)*.55,tech:'ownchip'},
 {id:'sam',n:'Samsung HBM',it:'hbm',u:'GW-eq',lead:2,open:.25,price:()=>2,cap:q=>hbmEq(q)*.25,rd:r=>RIV[r].g*(1-RIV[r].nv)*.25,tech:'ownchip'},
 {id:'mu',n:'Micron HBM',it:'hbm',u:'GW-eq',lead:2,open:.25,price:()=>2,cap:q=>hbmEq(q)*.2,rd:r=>RIV[r].g*(1-RIV[r].nv)*.2,tech:'ownchip'},
 {id:'gev',n:'GE Vernova',it:'core',u:'GW turbines',lead:4,open:.10,price:()=>1.5,cap:q=>q>=5?6:5,rd:r=>RIV[r].g*.3*.35,note:'mostly sold out through \'30'},
 {id:'sie',n:'Siemens Energy',it:'core',u:'GW turbines',lead:4,open:.15,price:()=>1.5,cap:()=>3.75,rd:r=>RIV[r].g*.3*.25},
 {id:'mhi',n:'Mitsubishi Heavy',it:'core',u:'GW turbines',lead:5,open:.15,price:()=>1.4,cap:()=>3,rd:r=>RIV[r].g*.3*.2},
 {id:'aero',n:'Solar Turbines / ProEnergy (aero)',it:'core',u:'GW turbines',lead:2,open:.35,price:()=>2.5,cap:()=>2,rd:r=>RIV[r].g*.3*.2,note:'the Southaven mix'},
 {id:'how',n:'Howmet / PCC blades & vanes',it:'blade',u:'blade sets',lead:5,open:1,price:()=>.004,cap:()=>300,rd:r=>RIV[r].g*.3*34*.7,note:'1 set = 154 blades + 94 vanes'},

 {id:'xfs',n:'Transformers, spot/refurb',it:'xf',u:'GW',lead:3,open:1,price:()=>1.2,cap:()=>.6,rd:r=>RIV[r].g*.05},
 {id:'cool',n:'Cooling makers (CDUs)',it:'cdu',u:'GW (556 CDUs each)',lead:2,open:1,price:()=>.8,cap:()=>9,rd:r=>RIV[r].g*1},
];
function cowosEq(q){return (12+(18.9-12)*Math.min(q,4)/4)*(S?S.mod.cowos:1)}
function hbmEq(q){return 19*(S?S.mod.hbm:1)}
const B={
 shell:{n:'Datacenter shell',ic:'🏢',c:3,lead:2,cap:500,col:'#7aa7d9',d:'500 MW of IT space'},
 cool:{n:'Cooling plant',ic:'❄️',c:.3,lead:1,cool:500,need:{cdu:.5},col:'#5fe0ff',d:'uses 0.5 GW of CDUs (~278)'},

 solar:{n:'Solar + Megapack farm',ic:'☀️',c:1.2,lead:2,pow:150,need:{mega:2},col:'#ffd84d',d:'500 MW of solar + 2 GWh of Megapacks → 150 MW firm'},
 col:{n:'Colossus 1+2 complex',ic:'🏭',hide:1,c:0,lead:0,pow:2200,cap:2200,cool:2200,mw:2200,col:'#c0c8d8',d:'Memphis/Southaven: ~2.2 GW nameplate (CFO, end-Oct 2026)'},
 sth:{n:'Southaven turbine plant',ic:'🔥',hide:1,c:0,lead:0,pow:1200,needBlades:41,col:'#ff8a3d',d:'41 permitted turbines ≈1.2 GW; waiting for 41 blade sets'},
};
const TECH=[
 {id:'casting',n:'Own blade & vane casting shop',lab:'AN',c:4,t:2,fx:'+150 blade sets/qtr from your own shop. Musk: "we\'re casting the blades and vanes"'},
 {id:'mega',n:'Tesla Megapack priority',lab:'SP',c:1,t:1,fx:'Your Megapack share rises from 25% to 60% of Tesla\'s 110 GWh/yr. The capacity is sourced; the priority deal is speculative'},
 {id:'optimus',n:'Optimus robots as builders',lab:'SP',c:3,t:2,fx:'Shells and solar farms build 1 quarter faster. Optimus production began in Fremont, but this use is speculative'},
 {id:'ownchip',n:'Own AI chip (AI5/AI6/Dojo-class) on TSMC',lab:'SP',c:6,t:2,fx:'Opens the TSMC and HBM order books. A chip arrives once both TSMC and HBM deliver ($16bn + $2bn per GW)'},

  if(d.pow&&!(d.needBlades&&b.bl<d.needBlades))pow+=d.pow;if(d.cap)cap+=d.cap;if(d.cool)cool+=d.cool*(1-(S.derate||0));if(d.mw)mw+=d.mw});
 const site=Math.min(mw,pow,cap,cool);const extra=(S.boxes+S.orbital)*100;const online=site+extra;
 gpus=Math.min(site,2200)*410+Math.max(0,site-2200)*270+extra*270; // per MW: 410/270 GPUs (derived)
 const lim=site<mw?(site===pow?'power':site===cap?'shell space':'cooling'):null;
 return{pow,cap,cool,mw,site,online,gpus:gpus*1000/1000,lim}}

function resolveOrders(){const book=[];
 SUP.forEach(s=>{const open=s.cap(S.q)*s.open;const rv=rivalReq(s);const me=Math.max(0,+(S.req[s.id]||0));const w=[1,1.6,2.4][S.pri[s.id]||0];
  const reqs=Object.entries(rv).map(([k,v])=>({k,v,w:1}));reqs.push({k:'You',v:me,w});
  const tot=reqs.reduce((a,r)=>a+r.v,0),wt=reqs.reduce((a,r)=>a+r.v*r.w,0);
  reqs.forEach(r=>{r.a=tot<=open?r.v:Math.min(r.v,open*r.v*r.w/wt)});
  // redistribute leftovers once
  let left=open-reqs.reduce((a,r)=>a+r.a,0);if(left>1e-6){const un=reqs.filter(r=>r.a<r.v);const uw=un.reduce((a,r)=>a+r.v*r.w,0);un.forEach(r=>{r.a=Math.min(r.v,r.a+left*r.v*r.w/uw)})}
  const mine=reqs.find(r=>r.k==='You');const cost=mine.a*s.price(S.q)*[1,1.1,1.25][S.pri[s.id]||0];
  let got=S.cash<-60?0:mine.a;
  if(got>1e-6){let lead=s.lead;if(s.id==='how'&&S.castSlip)lead++;S.pipe.push({it:s.it,qty:got,q:S.q+lead,from:s.n,cost})}
  book.push({s,open,tot,reqs,got,me,blocked:S.cash<-60&&me>0})});
 S.book=book;S.lastQ=S.q}

 for(const t in S.buildQ){}
