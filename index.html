<style>

 #sheetBtn{display:inline-flex}#orders{left:6px;right:6px;bottom:118px;max-height:52vh}
 #buildbar{bottom:6px;left:6px;right:6px;transform:none;max-width:none}.bb{width:72px;flex-basis:72px}.bb img{width:54px;height:42px}.bb small{display:none}
 #hud{display:none}
}

@media(max-width:760px){#lb{left:6px;right:6px;width:auto;top:auto;bottom:120px;display:none}.tt{grid-template-columns:1fr}}
#sCash.bump{animation:bump .35s ease-out}@keyframes bump{0%{transform:scale(1.25);color:#bfffe0;text-shadow:0 0 14px #4ef0a0}100%{transform:scale(1)}}.flash{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle at var(--fx) var(--fy),rgba(255,220,160,.35),transparent 40%);animation:fl .6s ease-out forwards}@keyframes fl{to{opacity:0}}.soon{opacity:.5}
</style></head><body>
<style>

.act.new:after{content:"NEW";position:absolute;top:-6px;right:-4px;font-size:8.5px;background:var(--ok);color:#03140b;padding:1px 5px;border-radius:6px;font-weight:800;letter-spacing:.08em}
.act.hint{border-color:var(--acc);box-shadow:0 0 0 1px rgba(83,198,255,.4),0 0 24px rgba(83,198,255,.35);animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(83,198,255,.6),0 0 34px rgba(83,198,255,.55)}}
.spd{display:flex;gap:2px;margin-left:8px}.spd button{padding:5px 8px;font-size:11px}

@media(max-width:760px){#right{top:auto;height:44vh;left:6px;right:6px;width:auto;display:none}#right.open{display:flex}#goalc{left:6px;right:6px;width:auto;top:142px;padding:8px 10px}.spd{margin-left:0}#goalc .gt{font-size:13px}#actbar{left:6px;right:6px;transform:none;max-width:none;bottom:6px}.act{min-width:92px}}
</style></head><body>
<div id="cvwrap"><canvas id="cv"></canvas></div>
<header class="glass"><div class="brand"><b>Elon Tycoon</b><small>START: 30 NOV 2022 · <a href="v4/">v4</a> · <a href="v3/">v3</a></small></div>
<div class="stat"><span>Date</span><b id="sD"></b></div><div class="stat hi"><span>Cash</span><b id="sCash"></b></div><div class="stat"><span>Income / mo</span><b id="sInc"></b></div><div class="stat"><span>Boosters landed</span><b id="sLand"></b></div><div class="stat opt"><span>Cars / week</span><b id="sCars"></b></div><div class="stat"><span>Launches</span><b id="sRk"></b></div>
<div class="spd" id="spd"></div><div class="sp"></div>
<button id="techBtn" class="ib" title="Research: coming soon"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8l3.5 8M16.5 8L13 16M8.5 6h7"/></svg><span class="lb">Research</span></button><button id="srcBtn" class="ib" title="Sources"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1z"/><path d="M12 6v14"/></svg><span class="lb">Sources</span></button>
<button id="sheetBtn" class="ib" title="Assistant"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button></header>
<div id="goalc" class="glass"></div><div id="lb" class="glass"></div>
<div id="right" class="glass"><div id="chat"></div><div id="chips"></div><div id="cin"><input id="ci" placeholder="Ask or command… e.g. found xai" autocomplete="off"><button id="cgo">Send</button><button id="cset" title="Settings">⚙</button></div></div>
<div id="actbar" class="glass"></div><div id="tip" class="glass"></div><div id="toast" class="glass"></div>
<div id="modal"><div class="glass" id="mbox"></div></div>
<script>
// ===== Elon Tycoon v5 MVP · start 30 Nov 2022 · S = sourced public fact (dated), A = game assumption =====
const SRC=[
['S','ChatGPT released, 30 Nov 2022','OpenAI'],
['S','Twitter acquisition closed for ~$44bn, 27 Oct 2022','SEC filings / press'],
['S','Tesla delivered 1,313,851 vehicles in 2022 (≈25k per week); factories: Fremont, Shanghai, Berlin, Texas','Tesla Q4 2022 update (Jan 2023)'],
['S','SpaceX flew 61 Falcon launches in 2022; Falcon 9 list price $67M (from Mar 2022)','SpaceX'],
['A','Starting cash $2bn for this game (not Tesla or SpaceX balance sheets)','Game assumption'],
['A','Profit $2,000 per car delivered; car rate split across the 4 factories by a fixed share and grows 2% a month','Game assumption'],
['A','Launch cost $28M, so each launch nets $39M of the $67M list price; pad turnaround 6 game days','Game assumption'],
['A','Expand a line: +5% car rate; cost starts $0.3bn, +40% each time. Pad upgrade: −30% turnaround, $0.25bn, +60% each time','Game assumption'],
];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr=t=>{const m=10+Math.floor(t);return(t<1?'30 ':'')+MON[m%12]+' '+(2022+Math.floor(m/12))};
const B={shell:{sz:[4,3],lead:1,col:'#7d8796'},pad:{sz:[3,3],lead:1},boxfab:{sz:[3,2],lead:1},sub:{sz:[2,2],lead:1},solar:{sz:[3,3],lead:1},cool:{sz:[2,2],lead:1},hall:{sz:[2,2],lead:1},turb:{sz:[3,2],lead:1},asm:{sz:[3,2],lead:1},cast:{sz:[3,2],lead:1},col:{sz:[5,4],lead:1}};
const castOut=()=>1;const W=25,H=18;
const ITC={car:'#e8f0fb',rocket:'#dfe6ef',cell:'#ffd84d',sat:'#9fd8ff',mega:'#ffd84d'};
const FAC=[['fremont','Fremont',.3],['shanghai','Giga Shanghai',.4],['berlin','Giga Berlin',.15],['texas','Giga Texas',.15]];
const SITES={fremont:{n:'Fremont',art:'shell',x:2,y:3,sz:[3,3]},shanghai:{n:'Giga Shanghai',art:'shell',x:2,y:9,sz:[4,3]},berlin:{n:'Giga Berlin',art:'shell',x:9,y:3,sz:[3,3]},texas:{n:'Giga Texas',art:'shell',x:9,y:9,sz:[4,3]},
 pad:{n:'Launch pad',art:'pad',x:18,y:4,sz:[3,3]},lz:{n:'Landing zone',x:20,y:11,sz:[2,2]},x:{n:'X (Twitter)',art:'hall',x:14,y:7,sz:[2,2]}};
let S;
function newGame(){S={t:0,cash:2,cars:0,carsWk:25000,launches:0,landings:0,flight:null,cd:0,lines:0,pads:0,speed:1,paused:false,month:0,goal:0,done:[],unl:{},newActs:{},news:[],carAcc:{}};
 chat('a',`It's <b>30 November 2022</b> and OpenAI has just released <b>ChatGPT</b>. Your four car factories are already running. Every car that rolls off a line brings in money, and every rocket launch pays too.<br><br>Press <b>Launch rocket</b> to start earning, and watch the booster come back down.`);sync()}
const fk=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(n<1e4?1:0)+'k':String(Math.round(n));
const money=b=>(b<0?'−':'')+'$'+(Math.abs(b)>=1?Math.abs(b).toFixed(2)+'bn':Math.round(Math.abs(b)*1000)+'M');
// ---- goals ----
const GOALS=[
 {n:'Launch your first rocket',par:'Falcon 9 · $67M list price (2022)',ok:()=>S.launches>=1,msg:'Booster recovered. Unlocked: <b>Expand a factory line</b>.',un:['line']},
 {n:'Reach $3bn cash',par:'Cars and launches both pay',ok:()=>S.cash>=3,msg:'Unlocked: <b>Faster pad turnaround</b>.',un:['pad']},
 {n:'Fly 25 launches',par:'Real: SpaceX flew 61 in 2022',ok:()=>S.launches>=25,msg:'Reuse is paying off.',un:[]},
 {n:'Reach 40,000 cars a week',par:'Expand lines to grow the rate',ok:()=>S.carsWk>=40000,msg:'Next build: xAI, research and the AI race.',un:[]},
];
function checkGoal(){const g=GOALS[S.goal];if(!g||!g.ok())return;S.done.push({n:g.n,at:dstr(S.t)});chat('g',`🎯 <b>${g.n}</b> (${dstr(S.t)}). ${g.msg}`);g.un.forEach(u=>{S.unl[u]=1;S.newActs[u]=1});S.goal++;celebrate();checkGoal()}
// ---- actions ----
function act(id,a){
 if(id==='launch'){if(S.flight)return say('a','A rocket is already flying. Wait for the landing.');if(S.cd>0)return say('a','The pad is being turned around. Ready in a few seconds.');S.flight={t:0,dur:4.2};S.launches++;fxRocket();return say('a',`🚀 Liftoff! Launch #${S.launches}. +$39M when the payload reaches orbit.`)}
 if(id==='line'){if(!S.unl.line)return say('a','Launch your first rocket first.');const c=.3*Math.pow(1.4,S.lines);if(S.cash<c)return say('b',`Expanding a line costs ${money(c)}.`);S.cash-=c;S.lines++;S.carsWk*=1.05;bumpCash();FAC.forEach(([k])=>pop(SITES[k],'+5% rate'));checkGoal();return say('a',`Lines expanded: now <b>${fk(S.carsWk)} cars/week</b>.`)}
 if(id==='pad'){if(!S.unl.pad)return say('a','Reach $3bn first.');const c=.25*Math.pow(1.6,S.pads);if(S.cash<c)return say('b',`Pad upgrade costs ${money(c)}.`);S.cash-=c;S.pads++;bumpCash();return say('a',`Pad turnaround now ${Math.round(6*Math.pow(.7,S.pads)*10)/10} game days.`)}
 return say('b','Not available yet.')}
function resolveFlight(){S.flight=null;S.cash+=.039;S.landings++;S.cd=.2*Math.pow(.7,S.pads);bumpCash();pop(SITES.pad,'+$39M',39);landFx(true);checkGoal();sync()}
function month(){S.bought=0;S.carsWk*=1.02;checkGoal();sync()}
// ---- loop ----
let lastT=performance.now();const SECPM=5;
