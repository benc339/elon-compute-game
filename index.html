<style>

.act.new:after{content:"NEW";position:absolute;top:-6px;right:-4px;font-size:8.5px;background:var(--ok);color:#03140b;padding:1px 5px;border-radius:6px;font-weight:800;letter-spacing:.08em}
.act.hint{border-color:var(--acc);box-shadow:0 0 0 1px rgba(83,198,255,.4),0 0 24px rgba(83,198,255,.35);animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(83,198,255,.6),0 0 34px rgba(83,198,255,.55)}}
.spd{display:flex;gap:2px;margin-left:8px}.spd button{padding:5px 8px;font-size:11px}

@media(max-width:760px){#right{top:auto;height:44vh;left:6px;right:6px;width:auto;display:none}#right.open{display:flex}#goalc{left:6px;right:6px;width:auto;top:142px;padding:8px 10px}.spd{margin-left:0}#goalc .gt{font-size:13px}#actbar{left:6px;right:6px;transform:none;max-width:none;bottom:6px}.act{min-width:92px}}
</style></head><body>
<div id="cvwrap"><canvas id="cv"></canvas></div>
<header class="glass"><div class="brand"><b>Elon Tycoon</b><small>START: JAN 2015 · <a href="v3/">v3</a> · <a href="v2/">v2</a></small></div>
<div class="stat"><span>Date</span><b id="sD"></b></div><div class="stat hi"><span>Cash</span><b id="sCash"></b></div><div class="stat"><span>Cars</span><b id="sCars"></b></div><div class="stat"><span>Rockets</span><b id="sRk"></b></div><div class="stat"><span>Reputation</span><b id="sRep"></b></div>
<div class="spd" id="spd"></div><div class="sp"></div>
<button id="srcBtn" class="ib" title="Sources"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1z"/><path d="M12 6v14"/></svg><span class="lb">Sources</span></button>
<button id="sheetBtn" class="ib" title="Assistant"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button></header>

<div id="right" class="glass"><div id="chat"></div><div id="chips"></div><div id="cin"><input id="ci" placeholder="Ask or command… e.g. launch a rocket" autocomplete="off"><button id="cgo">Send</button><button id="cset" title="Settings">⚙</button></div></div>

<div id="modal"><div class="glass" id="mbox"></div></div>
<script>
// ===== Elon Tycoon v4 · start Jan 2015 · S = sourced public fact, A = game assumption =====
const SRC=[
['S','Tesla delivered 50,580 cars in 2015 (Model S + first Model X)','Tesla Q4 2015 shareholder letter'],
['S','Model X deliveries began 29 Sep 2015','Tesla launch event, Fremont'],
['S','Tesla cash ~$1.9bn at end-2014','Tesla 2014 Form 10-K'],
['S','SpaceX raised $1bn from Google and Fidelity, Jan 2015','SpaceX press release, 20 Jan 2015'],
['S','Falcon 9 list price ~$62M','SpaceX capabilities & services page (2015–2016)'],
['S','CRS-7 Falcon 9 failure, 28 Jun 2015','NASA / SpaceX'],
['S','First Falcon 9 booster landing, 21 Dec 2015 (ORBCOMM-2, LZ-1)','SpaceX'],
['S','First reflight of an orbital booster, 30 Mar 2017 (SES-10)','SpaceX'],
['S','Gigafactory Nevada: ~$5bn with partners, groundbreaking 2014; cell production from Jan 2017','Tesla Gigafactory announcement (2014); Tesla/Panasonic (Jan 2017)'],
['S','Model 3 unveiled 31 Mar 2016; ~325,000 reservations in the first week','Tesla blog, 7 Apr 2016'],
['S','Model 3 reached ~5,000/week at end of June 2018 ("production hell")','Tesla Q2 2018 update'],
['S','First 60 Starlink satellites launched 23 May 2019','SpaceX'],
['S','Megapack announced Jul 2019; Powerwall/Powerpack announced 30 Apr 2015','Tesla'],
['S','Giga Shanghai groundbreaking Jan 2019, first deliveries Dec 2019','Tesla'],
['S','Starship first reached space on Flight 3 (Mar 2024) and SpaceX reported orbit-class flights later; Flight 14 deployed Starlink V3 (Oct 2026)','SpaceX; SPCX Q3 2026 call'],
['A','One combined cash pool for Tesla + SpaceX (start $2.9bn = Tesla ~$1.9bn + SpaceX $1bn raise)','Game simplification'],
['A','Car economics: Model S/X cost $70k, sells $90k; Model 3 cost $38k, sells $45k; monthly overhead $120M rising with scale','Game balance'],
['A','Fremont S/X line ~4,300 cars/month; demand = 3,000/month + 40 × reputation','Game balance (real 2015 deliveries ≈ 4,200/month)'],
['A','Rocket build cost $45M (expendable), $15M refurbish when reused; launch failure 5% (falls to 2% after reuse); landing chance = 70% of landing R&D progress; each failed attempt adds 6% progress','Game balance'],
['A','R&D costs and progress per $100M; Model 3 line starts at 150/week and ramps faster with funding; without Gigafactory cells it caps at 1,500/week','Game balance'],
['A','Raise money: you get $300M + $12M × reputation; costs 4 reputation; 3-month cooldown','Game balance (cost of capital falls with hype)'],
['A','Starlink: 60 sats per launch; $1M/month revenue per 100 sats after 400 are up','Game balance'],
['A','All news beats are simplified game events inspired by the real timeline','Game design'],
];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dstr=t=>MON[Math.floor(t)%12]+' '+(2015+Math.floor(t/12));
// ---- art registry for the reused renderer ----
const B={shell:{sz:[4,3],lead:1,col:'#7d8796'},pad:{sz:[3,3],lead:1,col:'#4d5560'},boxfab:{sz:[3,2],lead:1,col:'#5a5078'},sub:{sz:[2,2],lead:1,col:'#808a97'},solar:{sz:[3,3],lead:1,col:'#1f3f78'},cool:{sz:[2,2],lead:1},hall:{sz:[2,2],lead:1},turb:{sz:[3,2],lead:1},asm:{sz:[3,2],lead:1},cast:{sz:[3,2],lead:1},col:{sz:[5,4],lead:1}};
const castOut=()=>1;const W=25,H=18;
const ITC={car:'#e8f0fb',rocket:'#dfe6ef',cell:'#ffd84d',sat:'#9fd8ff',mega:'#ffd84d',gpu:'#3ddc84'};
// ---- sites (map) ----
const SITES={
 fremont:{n:'Fremont factory',art:'shell',x:7,y:5,sz:[5,4],d:'Tesla Fremont, CA. Builds Model S (and Model X from late 2015).'},
 pad:{n:'Launch pad SLC-40',art:'pad',x:17,y:5,sz:[3,3],d:'Cape Canaveral. Falcon 9 launches from here.'},
 lz:{n:'Landing Zone 1',art:'land',x:21,y:10,sz:[2,2],d:'Where boosters try to land. Odds = landing R&D progress.'},
 giga:{n:'Gigafactory Nevada',art:'shell',x:6,y:12,sz:[6,4],d:'Battery cells for Model 3. Lifts the 1,500/week cell cap.'},
 mega:{n:'Megapack line',art:'boxfab',x:13,y:14,sz:[3,2],d:'Grid batteries from spare cells: steady income.'},
 shanghai:{n:'Giga Shanghai',art:'shell',x:13,y:9,sz:[4,3],d:'+3,000 Model 3/week capacity once built.'},
 starlink:{n:'Starlink ground station',art:'sub',x:21,y:14,sz:[2,2],d:'Downlink for your satellites.'},
 starship:{n:'Starbase (Boca Chica)',art:'pad',x:16,y:14,sz:[3,3],d:'Starship development and test flights.'},
};
let S;
function newGame(){S={t:0,cash:2900,cars:0,carQ:0,sold:0,rep:40,rockets:0,launches:0,landings:0,reflights:0,sats:0,m3:0,m3rate:0,
 rd:{land:{p:0,need:900,n:'Booster landing'}},built:{fremont:1,pad:1},building:{},unl:{},goal:0,raiseCd:0,flight:null,speed:1,paused:false,month:0,news:[],hint:'launch',newActs:{},lastMonth:0,carsBuiltM:0,bankrupt:0,done:[]};
 chat('a',`It's <b>January 2015</b>. You run Tesla and SpaceX. Tesla builds the Model S in Fremont; SpaceX flies Falcon 9 — and throws every booster away.<br><br>Your first goal: <b>land a Falcon 9 booster</b>. Fund landing R&D, then launch. I'll only show you what you can use right now.`);
 chat('a','Try: <b>Launch rocket</b> (earns $62M from a customer) or type "fund landing".');sync()}
// ---- goals (one at a time) ----
const GOALS=[
 {n:'Land a Falcon 9 booster',par:'Real: 21 Dec 2015',ok:()=>S.landings>=1,unlock:['reuse','giga'],msg:'Booster landed! Unlocked: <b>Booster reuse</b> R&D and <b>Build Gigafactory</b>.'},
 {n:'Re-fly a landed booster',par:'Real: 30 Mar 2017',ok:()=>S.reflights>=1,unlock:['m3'],msg:'A used booster flew again! Unlocked: <b>Model 3</b> R&D. The mass-market car is next.'},
 {n:'Model 3 at 5,000 per week',par:'Real: end of Jun 2018',ok:()=>S.m3rate>=5000,unlock:['starlink','mega','shanghai'],msg:'Production hell survived! Unlocked: <b>Starlink</b>, <b>Megapack</b> and <b>Giga Shanghai</b>.'},
 {n:'1,000 Starlink satellites in orbit',par:'Real: Jan 2021',ok:()=>S.sats>=1000,unlock:['starship'],msg:'1,000 satellites up! Unlocked: <b>Starship</b> R&D and Starbase.'},
 {n:'Starship reaches orbit',par:'Real: 2024–25 (orbit-class flights)',ok:()=>S.rd.starship&&S.rd.starship.p>=100,unlock:['later'],msg:'Starship is flying! The next layer — <b>xAI, GPUs, power and the chip supply chain</b> — is coming in a later build. Try the Oct-2026 game at <a href="v3/">/v3/</a>.'},
];
// ---- actions (the only things the player can do) ----
const RD={land:{n:'Booster landing',need:900},reuse:{n:'Booster reuse',need:1500},m3:{n:'Model 3 program',need:1500},starlink:{n:'Starlink',need:1200},starship:{n:'Starship',need:4000}};
function curRD(){const o=Object.keys(S.rd).filter(k=>S.rd[k].p<100);return o}
function act(id,arg){const A={
 cars:()=>{const n=Math.max(1,Math.min(20,+arg||1));const cost=70*n;if(S.cash<cost)return say('b',`Not enough cash: ${n}k cars cost $${cost}M up front.`);S.cash-=cost;S.carQ+=n*1000;pop(SITES.fremont,`+${n},000 cars queued`);return say('a',`Queued <b>${(n*1000).toLocaleString()} Model S/X</b> at Fremont ($${cost}M). They sell for $90k each as demand allows.`)},
 launch:()=>launch(arg==='starlink'?'starlink':'customer'),
 fund:()=>{let k=arg&&S.rd[arg]?arg:curRD()[0];if(!k)return say('a','No R&D project needs money right now.');const r=S.rd[k];if(r.p>=100)return say('a',`${r.n} is already done.`);if(S.cash<100)return say('b','R&D costs $100M a step and you are short. Build cars, launch, or raise money.');
  S.cash-=100;r.p=Math.min(100,r.p+100/(r.need/100));pop(k==='land'||k==='reuse'||k==='starship'?SITES.pad:SITES.fremont,`${r.n} ${Math.round(r.p)}%`);if(r.p>=100)rdDone(k);return say('a',`Funded <b>${r.n}</b>: ${Math.round(r.p)}%.${k==='land'&&r.p<100?` Landing odds now ${Math.round(r.p*.7)}% per launch.`:''}`)},
 raise:()=>{if(S.raiseCd>0)return say('b',`Investors need ${S.raiseCd} more month(s) before another round.`);const amt=Math.round(300+12*S.rep);S.cash+=amt;S.rep=Math.max(0,S.rep-4);S.raiseCd=3;pop(SITES.fremont,`+$${amt}M raised`);return say('a',`Raised <b>$${amt}M</b>. Higher reputation means cheaper capital: at reputation ${Math.round(S.rep)} each round brings about $${Math.round(300+12*S.rep)}M.`)},
