<style>

.glass{background:var(--glass);border:1px solid var(--ln);border-radius:var(--r);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
header{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center;padding:6px 8px 6px 14px;z-index:4;white-space:nowrap}
.brand{display:flex;flex-direction:column;margin-right:10px;line-height:1.1}.brand b{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;background:linear-gradient(90deg,#fff,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{font-size:10px;color:var(--mut);letter-spacing:.08em}.brand a{color:var(--mut)}
.stat{display:flex;flex-direction:column;padding:2px 12px;border-left:1px solid var(--ln);min-width:74px}.stat span{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em}.stat b{font-size:15px;font-weight:600}

button:hover{border-color:var(--ln2);background:rgba(83,198,255,.08)}button:disabled{opacity:.35;cursor:not-allowed}button.sel{border-color:var(--acc);background:rgba(83,198,255,.16);box-shadow:0 0 0 1px rgba(83,198,255,.3),0 0 18px rgba(83,198,255,.25)}

.ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border-radius:3px}

.bb.lock{opacity:.5}.bb.lock img{filter:grayscale(1) brightness(.6)}.bb .tg{position:absolute;top:3px;right:3px;font-size:8px;padding:1px 5px;border-radius:6px;letter-spacing:.06em}.bb.no:not(.lock) .nm{color:#ffb0b8}
.bb .kbd{position:absolute;top:3px;left:5px;font-size:9px;color:var(--mut)}
#orders{position:fixed;left:10px;right:306px;bottom:120px;max-height:46vh;overflow:auto;padding:12px 14px;z-index:5}#orders.hide{display:none}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid rgba(130,170,230,.08);padding:6px 6px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.tag{font-size:9px;padding:2px 6px;border-radius:6px;white-space:nowrap;font-weight:700;letter-spacing:.06em}.S,.AN{background:rgba(78,240,160,.14);color:#8ff5c3}.D{background:rgba(83,198,255,.14);color:#9fd8ff}.A{background:rgba(255,181,71,.14);color:#ffcf85}.SP{background:rgba(255,90,170,.14);color:#ff9ccc}.MI{background:rgba(170,130,255,.16);color:#d0b8ff}
a{color:var(--acc)}

#toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);padding:8px 14px;z-index:7;display:none;font-size:12px;color:#ffd0d5;border-color:rgba(255,90,106,.4)}
#sheetBtn{display:none}
@media(max-width:1400px){.stat.opt{display:none}}
@media(max-width:1100px){.ib .lb{display:none}.brand small{display:none}}
@media(max-width:760px){
 header{top:6px;left:6px;right:6px;padding:5px 6px 5px 10px;gap:3px;flex-wrap:wrap}.brand{display:none}.stat{padding:1px 7px;min-width:0}.stat b{font-size:13px}.stat span{font-size:8.5px}
 header .sp{flex-basis:100%;height:0}header button{padding:5px 7px}#next span{display:none}#next{padding:6px 12px}#toast{top:auto;bottom:112px;max-width:90vw;white-space:normal}
 #right{top:auto;bottom:118px;left:6px;right:6px;width:auto;max-height:46vh;display:none}#right.open{display:block}

<script>
// ============ SOURCES: S = sourced, D = derived (our arithmetic), A = game-balance assumption (not a fact) ============
const SPCX='Motley Fool transcript, SpaceX (SPCX) Q3 2026 call, 20 Oct 2026';
const SRC=[
['S','Inference boxes, Musk verbatim: "We think there\'s also a lot of opportunity for inference compute if you manufacture modular inference compute at the factory level and then such that it\'s -- the power and cooling are built in at the factory and then you distribute modular inference compute clusters all over the country, if not all over the world. That\'s about as much as I should say about scaling power and cooling."',SPCX+' (an idea on the call; no product, size or date announced)'],
['S','Nameplate compute "nearly 2.2 gigawatts … at the end of this month alone in October"; 2.5–3 GW by end-Q4 2026 (CFO)',SPCX],
['S','"surprised" if less than 13 GW of compute by end-2027; "highly confident of 10 gigawatts" added in 2027; +20 GW power/cooling plan for 2027',SPCX],
['S','"roughly 200,000 GB300s online per month … next year being primarily Rubin, Vera Rubin" (a later "20,000" on the same call is treated as a slip)',SPCX+'; factory BREAKDOWN-SPACEX-13GW.md'],
['S','440,000 Vera Rubin training cluster by end-Q2 2027',SPCX],
['S','Blades/vanes "12 to 18 months behind the rest of the turbine"; "we\'re casting the blades and vanes for the turbines"',SPCX],
['S','Q4 2026 capex guide $35–40bn; Q3 capex $19.6bn',SPCX],
['S','New compute "payback of less than a year"; pricing slightly above the high end of $30–50 per watt',SPCX],
['S','Starship Flight 14 reached orbit and deployed Starlink V3; Flight 15 "next month" will try to catch both stages; weekly flights "at some point in the first half next year"',SPCX],
['S','Starlink 13.6M consumer subscribers; 90% share of global mass to orbit',SPCX],
['S','Terafab roadmap: test chip mid-2027, volume production by Q3 2028',SPCX+' (Fool key-points summary)'],
['S','Southaven permit: 41 turbines (17 Titan 130 + 16 Titan 350 + 8 ProEnergy 6000PE) ≈ 1.2 GW, MDEQ PSD 10 Mar 2026','Factory B1-059 / SOURCES-SPACEX-13GW (Compute Atlas)'],
['S','GE LM6000 HPT: 154 blades + 94 vanes per turbine','GE LM6000 tech-details deck (factory S9)'],
['S','GE Vernova: 20 GW/yr gas turbines (3Q26) → 24 GW (2028); "mostly sold out through \'30"','GE Vernova Q2 call, 22 Jul 2026'],
['S','Siemens Energy ~50 large gas turbines/yr from FY27','Factory notes (RQ-062)'],
['S','Global gas turbine capacity ~60–70 GW/yr','Wood Mackenzie via factory notes'],
['S','Large power transformer lead time 18–36 months','Wood Mackenzie (factory RQ-039, 3 Oct 2026)'],
['S','NVIDIA content ~$40bn/GW Vera Rubin, ~$25bn/GW Grace Blackwell','Jensen Huang, NVDA Q2 FY27 call (factory note)'],
['S','KGI CY2027: 5.89M Rubin + 2.85M Rubin Ultra','KGI, 15 Sep 2026'],
['S','TSMC CoWoS ~140k wafers/month end-2026 → ~220k end-2027','Institutional estimate, SECONDARY (factory cowos batch 6)'],
['S','2027 HBM demand 48.6–75.2bn Gb; Rubin 288 GB HBM4','Factory model range; Tom\'s Hardware'],
['S','Tesla installed capacity: Shanghai >950k, Fremont >550k, Berlin >375k Model Y, Texas >375k Model Y + >125k Cybertruck + >125k Cybercab, Nevada Semi 25k; Megapack 40 GWh (CA) + 50 GWh (TX) + 20 GWh (Shanghai); Optimus: early ramp (Fremont), construction (Texas)','Tesla Q3 2026 Update deck, 21 Oct 2026'],
['S','Rival plans: OpenAI Stargate >9 GW across 7 US sites (~0.3 GW Abilene live); Oracle >10 GW over 3 yrs; Meta Prometheus 1 GW by Q3 2028 + Hyperion 1.632 GW by Q1 2028; Microsoft Fairwater WI 2.263 GW by Q2 2028 (fleet not sourced); AWS +3.8–3.9 GW TTM, doubling by end-2027; Anthropic ≥14.8 GW commitments (overlaps AWS/Google); Google 2026 capex $195–205bn (no GW given); CoreWeave 4.2 GW contracted / 1.5 GW active','Factory QUEUED-ROOT-*-GW.md (Epoch, DCD, BlockWest, SEDaily, Alphabet, CoreWeave, Oct 2026)'],
['D','~34 turbines/GW → ~29 MW per unit (Southaven mix); 10 blade sets per 290 MW plant','1.2 GW ÷ 41'],
['D','GPUs per GW: GB300 ~410k, Vera Rubin ~270k (facility basis, PUE 1.3)','BREAKDOWN-SPACEX-13GW (Supermicro, Nodus, Kuo)'],
['D','HV transformers ~19–30 per GW (game uses 25); in-row CDUs ~556 per GW','BREAKDOWN-SPACEX-13GW'],
['D','NVIDIA 2027 output ≈ 34 GW/yr ≈ 8.5 GW per quarter','KGI units ÷ packages/GW (unit basis not confirmed)'],
['D','GE Vernova ≈ 5 GW per quarter; transformer lead 6 quarters (low end of 18–36 months); Howmet/PCC blade lag 5 quarters (middle of 12–18 months)','Arithmetic on the figures above'],
['D','Revenue ≈ $10bn per GW online per quarter','<1-year payback on ~$40bn/GW'],
['D','Rival demand per quarter = remaining GW in plan ÷ quarters to target date (OpenAI ~1.1, Oracle ~0.8, AWS ~1.0, Anthropic ~1.2, Meta ~0.36, Microsoft ~0.27, CoreWeave ~0.34 GW/qtr); Google ~1 GW/qtr = $200bn capex ÷ $50bn/GW (upper-bound method)','Factory roots above'],
['A','Pay on delivery; new orders blocked below −$60bn cash','Game balance'],
['A','Starting cash $77.5bn ($40bn + the Q4 capex budget); funding $37.5bn/qtr (midpoint of capex guide) + revenue; optional raise of $40bn/qtr','Game balance'],
['A','Share of each supplier\'s output open to new orders (GE Vernova 10%, Siemens/MHI 15%, aero 50% (v3b; was 35%), others 100%); OEM lead times; MHI 3 GW/qtr; Siemens 300 MW/unit; aero/industrial 2 GW/qtr','Game balance (real slot allocations unsourced)'],
['A','CoWoS and HBM GW-equivalents (packages per wafer unsourced); SK hynix/Samsung/Micron 55/25/20 split; NVIDIA uses 65% of CoWoS and 60% of HBM','Game balance'],
['A','Howmet/PCC 300 blade sets/qtr; transformer makers 7 GW-eq/qtr (spot 0.6 GW, 3 qtr, 3× price); cooling makers 9 GW-eq/qtr, 2 qtr lead','Game balance'],
['A','All non-NVIDIA prices (turbines, shells, cooling, transformers, solar, techs), build times, and "Others" demand of 1.5 GW/qtr','Game balance'],
['A','Southaven turbine cores are on site and OEM blades arrive Q2 2027; the existing 2.2 GW is self-sufficient in power, cooling and transformers','Game assumption (real status unsourced)'],
['A','Megapack share for xAI 25% (60% with tech); solar farm = 500 MW + 2 GWh Megapack → 150 MW firm','Game balance'],
['A','All tech-tree effects; inference box = 100 MW per fleet; orbital = 100 MW per launch batch','Game design. SPECULATIVE items are not real plans'],
['A','All news events are fictional scenarios inspired by real constraints','Game design'],

// ============ TIME & DATA ============
const QS=['Q4 2026','Q1 2027','Q2 2027','Q3 2027','Q4 2027','Q1 2028','Q2 2028','Q3 2028','Q4 2028'];
const GOALQ=4;
const RIV={OpenAI:{g:1.1,nv:.95},Oracle:{g:.8,nv:.95},AWS:{g:1.0,nv:.5},Anthropic:{g:1.2,nv:.4},Google:{g:1.0,nv:.25},Meta:{g:.36,nv:.9},Microsoft:{g:.27,nv:.8},CoreWeave:{g:.34,nv:1},Others:{g:1.5,nv:.8}};
// suppliers: cap(q) in item units/qtr (whole market), open = share open to new orders, lead qtrs, price $bn per unit
const SUP=[
 {id:'nv',n:'NVIDIA',it:'gpu',u:'GW racks',lead:1,open:1,price:q=>q<1?25:40,cap:q=>Math.min(q<1?7:8.5,cowosEq(q)*.65,hbmEq(q)*.6),rd:r=>RIV[r].g*RIV[r].nv,note:'GB300 now, Vera Rubin from Q1 2027'},
 {id:'tsmc',n:'TSMC N3 + CoWoS',it:'chip',u:'GW-eq',lead:3,open:.15,price:()=>16,cap:q=>cowosEq(q),rd:r=>RIV[r].g*(1-RIV[r].nv),tech:'ownchip',note:'For your own chip (needs HBM too)'},
 {id:'skh',n:'SK hynix HBM',it:'hbm',u:'GW-eq',lead:2,open:.2,price:()=>2,cap:q=>hbmEq(q)*.55,rd:r=>RIV[r].g*(1-RIV[r].nv)*.55,tech:'ownchip'},
 {id:'sam',n:'Samsung HBM',it:'hbm',u:'GW-eq',lead:2,open:.25,price:()=>2,cap:q=>hbmEq(q)*.25,rd:r=>RIV[r].g*(1-RIV[r].nv)*.25,tech:'ownchip'},
 {id:'mu',n:'Micron HBM',it:'hbm',u:'GW-eq',lead:2,open:.25,price:()=>2,cap:q=>hbmEq(q)*.2,rd:r=>RIV[r].g*(1-RIV[r].nv)*.2,tech:'ownchip'},
 {id:'gev',n:'GE Vernova',it:'core',u:'GW turbines',lead:4,open:.10,price:()=>1.5,cap:q=>q>=5?6:5,rd:r=>RIV[r].g*.3*.35,note:'mostly sold out through \'30'},
 {id:'sie',n:'Siemens Energy',it:'core',u:'GW turbines',lead:4,open:.15,price:()=>1.5,cap:()=>3.75,rd:r=>RIV[r].g*.3*.25},
 {id:'mhi',n:'Mitsubishi Heavy',it:'core',u:'GW turbines',lead:5,open:.15,price:()=>1.4,cap:()=>3,rd:r=>RIV[r].g*.3*.2},
 {id:'aero',n:'Solar Turbines / ProEnergy (aero)',it:'core',u:'GW turbines',lead:2,open:.5,price:()=>2.5,cap:()=>2,rd:r=>RIV[r].g*.3*.2,note:'the Southaven mix'},
 {id:'how',n:'Howmet / PCC blades & vanes',it:'blade',u:'blade sets',lead:5,open:1,price:()=>.004,cap:()=>300,rd:r=>RIV[r].g*.3*34*.7,note:'1 set = 154 blades + 94 vanes'},
 {id:'xf',n:'Transformer makers',it:'xf',u:'GW (25 HV units each)',lead:6,open:1,price:()=>.4,cap:()=>7,rd:r=>RIV[r].g*.75},
 {id:'xfs',n:'Transformers, spot/refurb',it:'xf',u:'GW',lead:3,open:1,price:()=>1.2,cap:()=>.6,rd:r=>RIV[r].g*.05},
 {id:'cool',n:'Cooling makers (CDUs)',it:'cdu',u:'GW (556 CDUs each)',lead:2,open:1,price:()=>.8,cap:()=>9,rd:r=>RIV[r].g*1},

function cowosEq(q){return (12+(18.9-12)*Math.min(q,4)/4)*(S?S.mod.cowos:1)}
function hbmEq(q){return 19*(S?S.mod.hbm:1)}
const B={
 shell:{n:'Datacenter shell',ic:'🏢',c:3,lead:2,cap:500,col:'#7aa7d9',d:'500 MW of IT space'},
 cool:{n:'Cooling plant',ic:'❄️',c:.3,lead:1,cool:500,need:{cdu:.5},col:'#5fe0ff',d:'uses 0.5 GW of CDUs (~278)'},
 hall:{n:'Rack hall',ic:'🟩',c:.5,lead:1,mw:500,need:{gpu:.5},col:'#3ddc84',d:'uses 0.5 GW of GPUs from the yard'},
 turb:{n:'Turbine plant',ic:'🔥',c:.4,lead:1,pow:290,need:{core:.29,blade:10},col:'#ff8a3d',d:'uses 0.29 GW of cores + 10 blade sets'},
